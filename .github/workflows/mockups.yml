# Publishes the static design mockups in docs/mockups to GitHub Pages.
#
# Only the mockups and their own assets (copies of the theme's fonts and the
# CC BY-SA badge in docs/mockups/assets) are published; the rest of docs/
# stays in the repository. The site keeps the docs/mockups/ path so existing
# links work. The site root redirects to the mockups index.
name: Mockups

on:
  push:
    branches: [trunk]
    paths:
      - 'docs/mockups/**'
      - '.github/workflows/mockups.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}docs/mockups/
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/docs
          cp -r docs/mockups _site/docs/mockups
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>WordPress.tv design mockups</title>
          <meta http-equiv="refresh" content="0; url=docs/mockups/">
          <link rel="canonical" href="docs/mockups/">
          </head>
          <body><p><a href="docs/mockups/">WordPress.tv design mockups</a></p></body>
          </html>
          HTML
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
